[package]
name = "ssc-protocol"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
crate-type = ["rlib", "cdylib"]
[dependencies]
base64 = "0.22.1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
flate2 = "1.1.2"
hex = "0.4.3"
hkdf = "0.12.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize", "alloc"] }
zeroize = "1.8.1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
