[package]
name = "ssc"
version = "0.2.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ssc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9.1"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
once_cell = "1.21.3"
webrtc = "0.13.0"
tokio = { version = "1.46.0", features = ["full"] }
hex = "0.4.3"
flate2 = "1.1.2"
ring = "0.17.14"
hkdf = "0.12.4"
sha2 = "0.10.9"
bytes = "1.10.1"
zeroize = "1.8.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[patch.crates-io]
webrtc-dtls = { path = "vendor/webrtc-dtls" }
webrtc-ice = { path = "vendor/webrtc-ice" }
